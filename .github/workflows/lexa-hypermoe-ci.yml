name: Lexa HyperMoE CI

on:
  push:
    branches: [main, feature/lexa-hypermoe-v1]
    paths:
      - "projects/lexa-hypermoe/**"
      - ".github/workflows/lexa-hypermoe-ci.yml"
  pull_request:
    paths:
      - "projects/lexa-hypermoe/**"
      - ".github/workflows/lexa-hypermoe-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/lexa-hypermoe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          lexa-hypermoe --version
          lexa-hypermoe optimize \
            --model data/model/gpt_oss_120b.json \
            --hardware data/hardware/rtx4080_i7_13700_32gb_assumed.json
      - name: Naming policy
        run: |
          if grep -RniE '5d9a' .; then
            echo 'Legacy public naming detected' >&2
            exit 1
          fi
