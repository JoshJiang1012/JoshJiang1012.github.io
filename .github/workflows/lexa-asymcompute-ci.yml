name: Lexa AsymCompute CI

on:
  push:
    paths:
      - "projects/lexa-asymcompute/**"
      - ".github/workflows/lexa-asymcompute-ci.yml"
  pull_request:
    paths:
      - "projects/lexa-asymcompute/**"
      - ".github/workflows/lexa-asymcompute-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/lexa-asymcompute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate analytical data
        run: python scripts/generate_reference_data.py
      - name: Release validation
        run: python scripts/validate_release.py
      - name: CLI smoke tests
        run: |
          lexa-asymcompute --version
          lexa-asymcompute formula-summary
          lexa-asymcompute optimize \
            --workload data/workloads/edge_pipeline_example.json \
            --hardware data/hardware/desktop_heterogeneous_example.json \
            --step 0.05
