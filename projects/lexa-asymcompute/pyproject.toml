[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexa-asymcompute"
version = "2.0.0"
description = "Reproducible asymmetric-compute modelling across GPU, CPU, RAM, storage and edge tiers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Josh Jiang"}]
keywords = ["heterogeneous-computing", "edge-computing", "scheduling", "moe", "performance-modeling"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]

[project.scripts]
lexa-asymcompute = "lexa_asymcompute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
